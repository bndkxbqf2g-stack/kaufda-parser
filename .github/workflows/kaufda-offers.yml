name: KaufDA-Angebote aktualisieren

on:
  workflow_dispatch:
    inputs:
      scope:
        description: 'Einzelmarkt, Prüfung aller fünf Märkte (all-check) oder Veröffentlichung (all)'
        type: choice
        options:
          - all-check
          - all
          - lidl
          - aldi-sued
          - edeka
          - netto
          - kaufland
        default: kaufland
        required: true
  schedule:
    # Täglich 05:15 UTC.
    - cron: '15 5 * * *'

concurrency:
  group: kaufda-offers
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  select-markets:
    runs-on: ubuntu-latest
    outputs:
      market_keys: ${{ steps.selection.outputs.market_keys }}
      assemble_feed: ${{ steps.selection.outputs.assemble_feed }}
      publish: ${{ steps.selection.outputs.publish }}
      debug_prospect: ${{ steps.selection.outputs.debug_prospect }}
      debug_spread: ${{ steps.selection.outputs.debug_spread }}
    steps:
      - id: selection
        env:
          RUN_SCOPE: ${{ inputs.scope || 'kaufland' }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] || [ "$RUN_SCOPE" = "all" ] || [ "$RUN_SCOPE" = "all-check" ]; then
            echo 'market_keys=["Lidl-Zellingen","Aldi-Sued-Zellingen","Edeka-Zellingen","Netto-Thuengersheim","Kaufland-Wuerzburg"]' >> "$GITHUB_OUTPUT"
            echo 'assemble_feed=true' >> "$GITHUB_OUTPUT"
            if [ "$GITHUB_EVENT_NAME" = "schedule" ] || [ "$RUN_SCOPE" = "all" ]; then
              echo 'publish=true' >> "$GITHUB_OUTPUT"
            else
              echo 'publish=false' >> "$GITHUB_OUTPUT"
            fi
            echo 'debug_prospect=false' >> "$GITHUB_OUTPUT"
            echo 'debug_spread=' >> "$GITHUB_OUTPUT"
          else
            case "$RUN_SCOPE" in
              lidl) echo 'market_keys=["Lidl-Zellingen"]' >> "$GITHUB_OUTPUT" ;;
              aldi-sued) echo 'market_keys=["Aldi-Sued-Zellingen"]' >> "$GITHUB_OUTPUT" ;;
              edeka) echo 'market_keys=["Edeka-Zellingen"]' >> "$GITHUB_OUTPUT" ;;
              netto) echo 'market_keys=["Netto-Thuengersheim"]' >> "$GITHUB_OUTPUT" ;;
              kaufland) echo 'market_keys=["Kaufland-Wuerzburg"]' >> "$GITHUB_OUTPUT" ;;
              *) echo "Unbekannter Marktumfang: $RUN_SCOPE" >&2; exit 1 ;;
            esac
            echo 'assemble_feed=false' >> "$GITHUB_OUTPUT"
            echo 'publish=false' >> "$GITHUB_OUTPUT"
            if [ "$RUN_SCOPE" = "kaufland" ]; then
              echo 'debug_prospect=true' >> "$GITHUB_OUTPUT"
              echo 'debug_spread=41' >> "$GITHUB_OUTPUT"
            else
              echo 'debug_prospect=false' >> "$GITHUB_OUTPUT"
              echo 'debug_spread=' >> "$GITHUB_OUTPUT"
            fi
          fi

  test-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: node src/cli.mjs validate --config kaufda-parser.config.json

  parse-market:
    needs: [test-and-validate, select-markets]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        market: ${{ fromJSON(needs.select-markets.outputs.market_keys) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - run: npm ci --no-audit --no-fund
      - run: npx --no-install playwright install chromium
      - name: Markt erfassen
        env:
          MARKET_KEY: ${{ matrix.market }}
          DEBUG_PROSPECT: ${{ needs.select-markets.outputs.debug_prospect }}
          DEBUG_SPREAD: ${{ needs.select-markets.outputs.debug_spread }}
        run: |
          mkdir -p generated/parts
          EXTRA_ARGS=()
          if [ "$DEBUG_PROSPECT" = "true" ]; then EXTRA_ARGS+=(--debug-prospect); fi
          if [ -n "$DEBUG_SPREAD" ]; then EXTRA_ARGS+=(--debug-spread "$DEBUG_SPREAD"); fi
          node src/cli.mjs parse --config kaufda-parser.config.json --market "$MARKET_KEY" --output "generated/parts/$MARKET_KEY.json" "${EXTRA_ARGS[@]}"
      - name: Marktergebnis prüfen
        env:
          MARKET_KEY: ${{ matrix.market }}
        run: node src/cli.mjs verify --config kaufda-parser.config.json --allow-empty --input "generated/parts/$MARKET_KEY.json"
      - name: Marktstatus ausgeben
        env:
          MARKET_KEY: ${{ matrix.market }}
          DEBUG_PROSPECT: ${{ needs.select-markets.outputs.debug_prospect }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const d = JSON.parse(fs.readFileSync(`generated/parts/${process.env.MARKET_KEY}.json`, 'utf8'));
          const includeEvidence = process.env.DEBUG_PROSPECT === 'true';
          const offers = d.offers.map((offer) => ({
            product: offer.product,
            price: offer.price,
            pack: offer.pack,
            sourcePage: offer.sourcePage,
            planningStatus: offer.planningStatus,
            ...(includeEvidence ? { evidence: offer.evidence, imageProductStatus: offer.fieldStatus?.imageProduct } : {})
          }));
          const reviewItems = includeEvidence ? d.reviewItems.map((item) => ({
            name: item.name,
            productDescription: item.productDescription,
            price: item.price,
            packSize: item.packSize,
            state: item.state,
            reasons: item.reasons,
            evidence: item.evidence
          })) : undefined;
          console.log(JSON.stringify({ summary: d.summary, market: d.markets[0], offers, reviewItems }, null, 2));
          NODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: market-${{ matrix.market }}
          path: generated/parts/${{ matrix.market }}.json
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: needs.select-markets.outputs.debug_spread != '' && matrix.market == 'Kaufland-Wuerzburg'
        with:
          name: kaufland-spread-debug
          path: generated/parts/debug/kaufland-wuerzburg-spread-41-42.png
          if-no-files-found: error
          retention-days: 3

  verify-feed:
    needs: [parse-market, select-markets]
    if: needs.select-markets.outputs.assemble_feed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: market-*
          path: generated/parts
          merge-multiple: true
      - name: Märkte zusammenführen
        run: node src/cli.mjs merge --config kaufda-parser.config.json --input-dir generated/parts --output generated/offers.next.json
      - name: Gesamtfeed prüfen
        run: node src/cli.mjs verify --config kaufda-parser.config.json --input generated/offers.next.json
      - name: Laufdaten ausgeben
        run: node -e "const d=require('./generated/offers.next.json'); console.log(JSON.stringify({summary:d.summary,markets:d.markets.map(({market,marketKey,recognizedOfferCount,loadedCardCount,imageOcrAttempted,imageOcrVerified,ocrDiagnostics})=>({market,marketKey,recognizedOfferCount,loadedCardCount,imageOcrAttempted,imageOcrVerified,ocrDiagnostics}))}, null, 2));"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-market-feed
          path: generated/offers.next.json
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [verify-feed, select-markets]
    if: needs.select-markets.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-market-feed
          path: generated
      - run: mv generated/offers.next.json generated/offers.json
      - run: git diff --check
      - name: Änderungen veröffentlichen
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add generated/offers.json
          git diff --cached --quiet || git commit -m 'chore: KaufDA-Angebote aktualisieren'
          git push
