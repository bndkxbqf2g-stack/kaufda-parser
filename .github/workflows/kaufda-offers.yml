name: KaufDA-Angebote aktualisieren

on:
  workflow_dispatch:
    inputs:
      scope:
        description: 'Kaufland einzeln prüfen oder alle Märkte zusammen aktualisieren'
        type: choice
        options:
          - kaufland
          - all
        default: kaufland
        required: true
  schedule:
    # Täglich 05:15 UTC.
    - cron: '15 5 * * *'

concurrency:
  group: kaufda-offers
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  select-markets:
    runs-on: ubuntu-latest
    outputs:
      market_keys: ${{ steps.selection.outputs.market_keys }}
      publish: ${{ steps.selection.outputs.publish }}
      debug_prospect: ${{ steps.selection.outputs.debug_prospect }}
    steps:
      - id: selection
        env:
          RUN_SCOPE: ${{ inputs.scope || 'kaufland' }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] || [ "$RUN_SCOPE" = "all" ]; then
            echo 'market_keys=["Lidl-Zellingen","Aldi-Sued-Zellingen","Edeka-Zellingen","Netto-Thuengersheim","Kaufland-Wuerzburg"]' >> "$GITHUB_OUTPUT"
            echo 'publish=true' >> "$GITHUB_OUTPUT"
            echo 'debug_prospect=false' >> "$GITHUB_OUTPUT"
          else
            echo 'market_keys=["Kaufland-Wuerzburg"]' >> "$GITHUB_OUTPUT"
            echo 'publish=false' >> "$GITHUB_OUTPUT"
            echo 'debug_prospect=true' >> "$GITHUB_OUTPUT"
          fi

  test-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: node src/cli.mjs validate --config kaufda-parser.config.json

  parse-market:
    needs: [test-and-validate, select-markets]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        market: ${{ fromJSON(needs.select-markets.outputs.market_keys) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - run: npm ci --no-audit --no-fund
      - run: npx --no-install playwright install chromium
      - name: Markt erfassen
        env:
          MARKET_KEY: ${{ matrix.market }}
          DEBUG_PROSPECT: ${{ needs.select-markets.outputs.debug_prospect }}
        run: |
          mkdir -p generated/parts
          EXTRA_ARGS=()
          if [ "$DEBUG_PROSPECT" = "true" ]; then EXTRA_ARGS+=(--debug-prospect); fi
          node src/cli.mjs parse --config kaufda-parser.config.json --market "$MARKET_KEY" --output "generated/parts/$MARKET_KEY.json" "${EXTRA_ARGS[@]}"
      - name: Marktergebnis prüfen
        env:
          MARKET_KEY: ${{ matrix.market }}
        run: node src/cli.mjs verify --config kaufda-parser.config.json --allow-empty --input "generated/parts/$MARKET_KEY.json"
      - name: Marktstatus ausgeben
        env:
          MARKET_KEY: ${{ matrix.market }}
          DEBUG_PROSPECT: ${{ needs.select-markets.outputs.debug_prospect }}
        run: node --input-type=module -e 'import fs from "node:fs"; const d=JSON.parse(fs.readFileSync(`generated/parts/${process.env.MARKET_KEY}.json`, "utf8")); const includeEvidence=process.env.DEBUG_PROSPECT === "true"; console.log(JSON.stringify({summary:d.summary,market:d.markets[0],offers:d.offers.map(offer=>({product:offer.product,price:offer.price,pack:offer.pack,sourcePage:offer.sourcePage,planningStatus:offer.planningStatus,...(includeEvidence?{evidence:offer.evidence,imageProductStatus:offer.fieldStatus?.imageProduct}: {})}))}, null, 2));'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: market-${{ matrix.market }}
          path: generated/parts/${{ matrix.market }}.json
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [parse-market, select-markets]
    if: needs.select-markets.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: market-*
          path: generated/parts
          merge-multiple: true
      - name: Märkte zusammenführen
        run: node src/cli.mjs merge --config kaufda-parser.config.json --input-dir generated/parts --output generated/offers.next.json
      - name: Gesamtfeed prüfen
        run: node src/cli.mjs verify --config kaufda-parser.config.json --input generated/offers.next.json
      - name: Ergebnis veröffentlichen
        run: mv generated/offers.next.json generated/offers.json
      - name: Laufdaten ausgeben
        run: node -e "const d=require('./generated/offers.json'); console.log(JSON.stringify({summary:d.summary,markets:d.markets.map(({market,marketKey,recognizedOfferCount,loadedCardCount,imageOcrAttempted,imageOcrVerified,ocrDiagnostics})=>({market,marketKey,recognizedOfferCount,loadedCardCount,imageOcrAttempted,imageOcrVerified,ocrDiagnostics}))}, null, 2));"
      - run: git diff --check
      - name: Änderungen veröffentlichen
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add generated/offers.json
          git diff --cached --quiet || git commit -m 'chore: KaufDA-Angebote aktualisieren'
          git push
