name: KaufDA-Angebote aktualisieren

on:
  workflow_dispatch:
  schedule:
    # Täglich 05:15 UTC. Der Lauf bleibt begrenzt und veröffentlicht den
    # Vollständigkeitsstatus zusammen mit den Angeboten.
    - cron: '15 5 * * *'
  push:
    paths:
      - 'kaufda-parser.config.json'
      - 'src/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/kaufda-offers.yml'

concurrency:
  group: kaufda-offers
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-offers:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: node src/cli.mjs validate --config kaufda-parser.config.json
      - run: npx --no-install playwright install chromium
      - name: KaufDA-Angebote begrenzt erfassen
        run: node src/cli.mjs parse --config kaufda-parser.config.json --output generated/offers.next.json
      - name: Ergebnis prüfen
        run: node src/cli.mjs verify --config kaufda-parser.config.json --input generated/offers.next.json
      - name: Ergebnis veröffentlichen
        run: mv generated/offers.next.json generated/offers.json
      - name: Laufdaten ausgeben
        run: node -e "const d=require('./generated/offers.json'); console.log(JSON.stringify(d.summary, null, 2));"
      - name: Diff prüfen
        run: git diff --check
      - name: Änderungen veröffentlichen
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add generated/offers.json
          git diff --cached --quiet || git commit -m 'chore: KaufDA-Angebote aktualisieren'
          git push
